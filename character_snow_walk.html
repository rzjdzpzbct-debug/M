<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>شخصية تمشي في عالم ثلجي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08182b;font-family:system-ui,sans-serif}
canvas{width:100%;height:100%;display:block}
.ui{position:fixed;top:16px;left:0;right:0;text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 12px #07172a}
.ui h1{font-size:clamp(18px,4vw,28px);font-weight:500;margin:0}.ui p{font-size:11px;color:#d2e8ff;margin:5px}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:10px;background:#08172c99;border:1px solid #c3e4ff44;border-radius:16px;backdrop-filter:blur(10px)}
button{border:1px solid #b7dcff66;background:#183b5a;color:white;padding:9px 14px;border-radius:11px;font-size:13px}
</style></head>
<body>
<canvas id="scene"></canvas>
<div class="ui"><h1>رحلة بين جبال الجليد</h1><p>شخصية متحركة • مشي طبيعي • مشهد ثلجي</p></div>
<div class="controls"><button id="toggle">⏸ إيقاف المشي</button><button id="speed">سرعة المشي: عادية</button></div>
<script>
const c=document.getElementById('scene'),x=c.getContext('2d');
let W,H,D,t=0,running=true,fast=false,particles=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);particles=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2,v:.25+Math.random()*1.1,a:.2+Math.random()*.6}))}
function poly(points,fill){x.fillStyle=fill;x.beginPath();x.moveTo(...points[0]);for(let p of points.slice(1))x.lineTo(...p);x.closePath();x.fill()}
function line(points,color,width){x.strokeStyle=color;x.lineWidth=width;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...points[0]);for(let p of points.slice(1))x.lineTo(...p);x.stroke()}
function glow(cx,cy,r,color){let g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(170,230,255,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function mountain(points,fill,edge){poly(points,fill);line(points,edge,2)}
function background(){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3284b4');g.addColorStop(.42,'#b9e6f4');g.addColorStop(.72,'#f1fbff');g.addColorStop(1,'#8dbbd7');x.fillStyle=g;x.fillRect(0,0,W,H);
 glow(W*.72,H*.44,Math.min(W,H)*.38,'rgba(255,255,255,.72)');
 // clouds
 for(let i=0;i<8;i++){let px=(i*W/6+Math.sin(t*.1+i)*16)%(W+150)-60,py=H*(.13+(i%3)*.09);glow(px,py,50+i%3*15,'rgba(255,255,255,.32)')}
 // distant icy peaks
 mountain([[-30,H*.57],[W*.04,H*.25],[W*.13,H*.44],[W*.22,H*.13],[W*.31,H*.48],[W*.42,H*.36],[W*.53,H*.51],[W*.62,H*.24],[W*.74,H*.5],[W*.88,H*.08],[W*1.04,H*.51],[W*1.04,H*.72],[-30,H*.72]],'#245c7e','#b7e8ff');
 mountain([[W*.1,H*.65],[W*.24,H*.36],[W*.31,H*.52],[W*.42,H*.43],[W*.53,H*.59],[W*.61,H*.3],[W*.73,H*.57],[W*.82,H*.39],[W*.99,H*.62],[W,H*.76],[0,H*.76]],'#326f8c','#c6efff');
 // snow streaks on peaks
 line([[W*.22,H*.14],[W*.25,H*.35],[W*.29,H*.47]],'rgba(235,252,255,.8)',3);
 line([[W*.62,H*.25],[W*.63,H*.39],[W*.68,H*.52]],'rgba(235,252,255,.75)',3);
 line([[W*.88,H*.1],[W*.86,H*.3],[W*.81,H*.46]],'rgba(235,252,255,.65)',3);
 // far ridge and frozen lake
 poly([[0,H*.69],[W*.16,H*.67],[W*.29,H*.7],[W*.48,H*.68],[W*.7,H*.71],[W,H*.67],[W,H],[0,H]],'#d6f3ff');
 let lake=x.createLinearGradient(0,H*.7,0,H);lake.addColorStop(0,'#a4d8f1');lake.addColorStop(1,'#5f9ec5');x.fillStyle=lake;x.fillRect(0,H*.72,W,H*.28);
 for(let i=0;i<16;i++){let yy=H*(.76+i*.014),xx=(i*97+t*8)%(W+100)-50;line([[xx,yy],[xx+40+Math.sin(i)*25,yy]],'rgba(235,251,255,.16)',1)}
 // foreground snow bank
 poly([[0,H*.92],[W*.18,H*.88],[W*.34,H*.94],[W*.53,H*.9],[W*.72,H*.93],[W,H*.86],[W,H],[0,H]],'#e8f8ff');
 // little blue ice rocks
 for(let i=0;i<5;i++){let xx=W*(.76+i*.065),yy=H*(.87+(i%2)*.025);poly([[xx-24,yy+18],[xx-12,yy-16],[xx+2,yy-25],[xx+23,yy+18]],'#397eaa')}
}
function character(px,ground,phase,scale=1){
 x.save();x.translate(px,ground);x.scale(scale,scale);
 // soft contact shadow
 let sh=x.createRadialGradient(0,0,2,0,0,42);sh.addColorStop(0,'rgba(10,35,55,.4)');sh.addColorStop(1,'rgba(10,35,55,0)');x.fillStyle=sh;x.beginPath();x.ellipse(0,0,42,9,0,0,Math.PI*2);x.fill();
 let swing=Math.sin(phase),lift=Math.max(0,Math.cos(phase))*7;
 // legs animated with natural alternating stride
 let hipY=-61,kneeY=-30,footY=-4;
 let leg1=[[-4,hipY],[-4+swing*10,kneeY-lift*.25],[-9+swing*23,footY-lift]];
 let leg2=[[5,hipY],[5-swing*10,kneeY-(7-lift)*.25],[8-swing*23,footY-(7-lift)]];
 line(leg1,'#071018',13);line(leg2,'#071018',13);
 // shoes
 line([[leg1[2][0]-2,leg1[2][1]],[leg1[2][0]+10,leg1[2][1]+2]],'#050a10',8);
 line([[leg2[2][0]-2,leg2[2][1]],[leg2[2][0]+10,leg2[2][1]+2]],'#050a10',8);
 // torso subtle bob
 let bob=Math.sin(phase*2)*1.6;
 line([[0,-72+bob],[-1,-43+bob]],'#071018',17);
 // arms swing opposite to legs
 line([[-2,-67+bob],[-12-swing*7,-52+bob],[-17-swing*10,-44+bob]],'#071018',8);
 line([[2,-67+bob],[12+swing*7,-53+bob],[16+swing*10,-46+bob]],'#071018',8);
 // oversized stylized head silhouette with spiky hair
 let headY=-91+bob;
 x.fillStyle='#03090e';x.beginPath();
 x.moveTo(-20,headY+12);x.lineTo(-29,headY+1);x.lineTo(-27,headY-13);x.lineTo(-37,headY-18);x.lineTo(-30,headY-34);x.lineTo(-18,headY-28);x.lineTo(-13,headY-48);x.lineTo(-2,headY-37);x.lineTo(7,headY-53);x.lineTo(19,headY-36);x.lineTo(29,headY-25);x.lineTo(32,headY-9);x.lineTo(25,headY+9);x.lineTo(12,headY+17);x.closePath();x.fill();
 // mint glowing eye
 glow(px+20,ground+headY-12,17,'rgba(73,255,204,.22)');
 x.fillStyle='#5effd0';x.beginPath();x.ellipse(18,headY-10,4.2,8,0,0,Math.PI*2);x.fill();
 x.restore();
}
function frame(){
 t+=running?(fast?.07:.035):0;
 background();
 let phase=t*3.3;
 // Character walks naturally in place, with gentle body movement and shifting weight
 let px=W*.48+Math.sin(t*.12)*W*.012;
 character(px,H*.91,phase,Math.min(W,H)/650);
 // snow particles with depth
 for(let p of particles){if(running){p.y+=p.v;p.x+=Math.sin(t*.4+p.y*.01)*.22;if(p.y>H+4){p.y=-5;p.x=Math.random()*W}}
 x.fillStyle=`rgba(255,255,255,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fill()}
 requestAnimationFrame(frame)
}
document.getElementById('toggle').onclick=()=>{running=!running;document.getElementById('toggle').textContent=running?'⏸ إيقاف المشي':'▶ تشغيل المشي'};
document.getElementById('speed').onclick=()=>{fast=!fast;document.getElementById('speed').textContent=fast?'سرعة المشي: سريعة':'سرعة المشي: عادية'};
addEventListener('resize',resize);resize();frame();
</script></body></html>
