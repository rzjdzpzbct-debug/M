<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل القرآن الكريم</title>
  <!-- FontAwesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #020617);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    /* كارت الواجهة بنفس تصميم iOS */
    .player-card {
      width: 100%;
      max-width: 360px;
      background: rgba(40, 40, 40, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* مربع ألبوم الغلاف للصورة */
    .album-art {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* تفاصيل السورة والشيخ */
    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .track-subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* شريط التقدم */
    .progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 3px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 6px;
    }

    /* أزرار التحكم */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-bottom: 25px;
      width: 100%;
    }

    .control-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 0.1s ease, color 0.2s;
    }

    .control-btn:active {
      transform: scale(0.9);
    }

    .play-btn {
      font-size: 2.4rem;
      color: #fff;
    }

    /* شريط مستوى الصوت */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .volume-icon {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* منطقة الأزرار العلوية/السفلية */
    .action-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    /* زر البث السريع */
    .airplay-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      text-decoration: none;
    }

    .airplay-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* زر انستغرام الأحمر */
    .instagram-btn {
      flex: 1;
      background: #e1306c;
      border: none;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .instagram-btn:hover {
      background: #d6245f;
      transform: translateY(-2px);
    }

    /* قائمة اختيار الإذاعات */
    .playlist-select {
      margin-top: 15px;
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
      outline: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- صورة الغلاف المضافة -->
    <div class="album-art">
      <img id="cover-img" src="https://i.ibb.co/6R2pC7D/alhamdulillah.jpg" alt="Alhamdulillah">
    </div>

    <!-- اسم السورة والشيخ -->
    <div class="track-info">
      <div class="track-title" id="title">متوقف</div>
      <div class="track-subtitle" id="subtitle">اختر إذاعة للبدء</div>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-container">
      <div class="progress-bar-bg" id="progress-container">
        <div class="progress-bar-fill" id="progress"></div>
      </div>
      <div class="time-info">
        <span id="current-time">--:--</span>
        <span id="duration">--:--</span>
      </div>
    </div>

    <!-- أزرار المشغل -->
    <div class="controls">
      <button class="control-btn" id="prev"><i class="fa-solid fa-backward-step"></i></button>
      <button class="control-btn play-btn" id="play"><i class="fa-solid fa-play" id="play-icon"></i></button>
      <button class="control-btn" id="next"><i class="fa-solid fa-forward-step"></i></button>
    </div>

    <!-- مستوى الصوت -->
    <div class="volume-container">
      <i class="fa-solid fa-volume-low volume-icon"></i>
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.8">
      <i class="fa-solid fa-volume-high volume-icon"></i>
    </div>

    <!-- الأزرار السفلية: البث السريع + زر انستغرام الأحمر -->
    <div class="action-buttons">
      <button class="airplay-btn" id="airplay">
        <i class="fa-solid fa-tower-broadcast"></i>
        <span>البث السريع</span>
      </button>

      <a href="https://instagram.com/4x15" target="_blank" class="instagram-btn">
        <i class="fa-brands fa-instagram"></i>
        <span>انستكرام</span>
      </a>
    </div>

    <!-- قائمة اختيار البث -->
    <select class="playlist-select" id="playlist">
      <option value="https://backup.qurango.net/radio/tarawih">إذاعة صلاة التراويح</option>
      <option value="https://backup.qurango.net/radio/mishary_alafasi">الشيخ مشاري العفاسي</option>
      <option value="https://backup.qurango.net/radio/abdulbasit_abdulsamad_mojawwad">الشيخ عبدالباسط عبدالصمد</option>
      <option value="https://backup.qurango.net/radio/maher_al_muaiqly">الشيخ ماهر المعيقلي</option>
    </select>
  </div>

  <audio id="audio" src="https://backup.qurango.net/radio/tarawih"></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const playlist = document.getElementById('playlist');
    const volume = document.getElementById('volume');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      isPlaying = true;
      playIcon.classList.remove('fa-play');
      playIcon.classList.add('fa-pause');
      audio.play();
      title.innerText = "إذاعة القرآن الكريم";
      subtitle.innerText = playlist.options[playlist.selectedIndex].text;
    }

    function pauseAudio() {
      isPlaying = false;
      playIcon.classList.remove('fa-pause');
      playIcon.classList.add('fa-play');
      audio.pause();
      title.innerText = "متوقف";
    }

    playBtn.addEventListener('click', togglePlay);

    playlist.addEventListener('change', (e) => {
      audio.src = e.target.value;
      if (isPlaying) {
        playAudio();
      } else {
        subtitle.innerText = playlist.options[playlist.selectedIndex].text;
      }
    });

    volume.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('timeupdate', (e) => {
      if (audio.duration) {
        const { duration, currentTime } = e.target;
        const progressPercent = (currentTime / duration) * 100;
        progress.style.width = `${progressPercent}%`;

        const formatTime = (time) => Math.floor(time / 60) + ':' + ('0' + Math.floor(time % 60)).slice(-2);
        currentTimeEl.innerText = formatTime(currentTime);
        durationEl.innerText = formatTime(duration);
      } else {
        currentTimeEl.innerText = "بث مباشر";
        durationEl.innerText = "LIVE";
      }
    });
  </script>
</body>
</html>
