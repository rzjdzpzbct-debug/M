<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصائر | المنصة القرآنية التفاعلية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        /* تصميم يحاكي زجاج أبل (iOS Glassmorphism) */
        .ios-player {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- الهيدر -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-xl">ب</div>
            <h1 class="text-xl font-bold tracking-wide">بصائر القرآنية</h1>
        </div>
        <span class="text-xs px-3 py-1 rounded-full bg-gray-800 text-amber-400 border border-gray-700">نسخة تفاعلية</span>
    </header>

    <!-- المحتوى الرئيسي: قائمة السور ومشغل الأيفون -->
    <main class="max-w-4xl mx-auto w-full my-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
        
        <!-- قائمة السور (تُجلب من المستودع) -->
        <div class="bg-gray-900/60 border border-gray-800 rounded-3xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-amber-400 flex items-center gap-2">
                <span>📖</span> اختر السورة للاستماع
            </h2>
            <div id="loading" class="text-center py-8 text-gray-400">جاري تحميل قائمة السور...</div>
            <select id="surahSelect" class="w-full bg-gray-800 border border-gray-700 rounded-2xl p-4 text-white focus:outline-none focus:border-amber-500 transition cursor-pointer mb-4 hidden">
                <!-- ستتم تعبئتها تلقائياً برمجياً -->
            </select>
            <button id="playBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-950 font-bold py-3.5 rounded-2xl transition shadow-lg shadow-amber-500/20 hidden">
                تشغيل التلاوة
            </button>
        </div>

        <!-- مشغل الصوت بتصميم الأيفون (iOS Player) -->
        <div class="ios-player rounded-[38px] p-6 max-w-sm mx-auto w-full flex flex-col justify-between">
            
            <!-- صورة الألبوم أو الغلاف الوهمي بتصميم آبل -->
            <div class="w-full aspect-square bg-gradient-to-br from-gray-800 to-gray-900 rounded-[28px] shadow-inner mb-6 flex flex-col items-center justify-center relative overflow-hidden border border-white/5">
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent"></div>
                <span class="text-5xl mb-2">🎙️</span>
                <span class="text-xs text-gray-400 tracking-wider uppercase">تلاوة خاشعة</span>
            </div>

            <!-- معلومات المسار -->
            <div class="text-center mb-6">
                <h3 id="trackTitle" class="text-lg font-bold text-white truncate px-2">اختر سورة للبدء</h3>
                <p id="trackSubtitle" class="text-xs text-gray-400 mt-1">القارئ: مشاري العفاسي</p>
            </div>

            <!-- شريط التقدم الزمني -->
            <div class="mb-5">
                <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-amber-400">
                <div class="flex justify-between text-[10px] text-gray-400 mt-1.5">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- أزرار التحكم الرئيسية (مطابقة لصورة الأيفون) -->
            <div class="flex items-center justify-center gap-6 mb-6">
                <button id="prevBtn" class="text-gray-400 hover:text-white transition transform active:scale-95">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="mainToggleBtn" class="w-16 h-16 rounded-full bg-white text-gray-950 flex items-center justify-center shadow-lg hover:scale-105 transition active:scale-95">
                    <svg id="playIcon" class="w-7 h-7 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="nextBtn" class="text-gray-400 hover:text-white transition transform active:scale-95">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <!-- شريط التحكم بالصوت والبث -->
            <div class="flex items-center gap-3 bg-black/20 p-3 rounded-2xl border border-white/5">
                <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white">
            </div>

        </div>

    </main>

    <!-- عنصر الصوت المخفي -->
    <audio id="audioPlayer"></audio>

    <!-- التذييل -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-500 py-4 border-t border-gray-800">
        تم الانشاء بكل حب لنشر القرآن الكريم &copy; 2026
    </footer>

    <!-- سكربت الجافاسكريبت للربط وتشغيل الصوت -->
    <script>
        const surahSelect = document.getElementById('surahSelect');
        const playBtn = document.getElementById('playBtn');
        const loading = document.getElementById('loading');
        const audioPlayer = document.getElementById('audioPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const mainToggleBtn = document.getElementById('mainToggleBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const volumeBar = document.getElementById('volumeBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let surahsData = [];

        // جلب قائمة السور من مستودع Quran JSON
        async function fetchSurahs() {
            try {
                // رابط مباشر لجلب بيانات السور
                const response = await fetch('https://raw.githubusercontent.com/semarketir/quranjson-web/master/json/surahs.json');
                surahsData = await response.json();
                
                surahSelect.innerHTML = '';
                surahsData.forEach((surah, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${surah.surah_name} (${surah.ayas} آية)`;
                    surahSelect.appendChild(option);
                });

                loading.style.display = 'none';
                surahSelect.classList.remove('hidden');
                playBtn.classList.remove('hidden');
            } catch (error) {
                loading.textContent = 'تعذر تحميل بيانات السور، تحقق من الاتصال.';
            }
        }

        fetchSurahs();

        // روابط تلاوات صوتية جاهزة وثابتة لكل سورة (باستخدام روابط صوتية عامة للقارئ مشاري العفاسي)
        function getAudioUrl(surahIndex) {
            // تنسيق رقم السورة ليكون بثلاثة أرقام مثل 001, 002
            const formattedNum = String(surahIndex + 1).padStart(3, '0');
            return `https://server8.mp3quran.net/afs/${formattedNum}.mp3`;
        }

        // تشغيل السورة المحددة
        function playSelectedSurah() {
            const selectedIndex = surahSelect.value;
            const surah = surahsData[selectedIndex];
            
            trackTitle.textContent = `سورة ${surah.surah_name}`;
            audioPlayer.src = getAudioUrl(parseInt(selectedIndex));
            audioPlayer.play();
            updatePlayIcon(true);
        }

        playBtn.addEventListener('click', playSelectedSurah);

        // زر التشغيل والإيقاف الكبير في المشغل
        mainToggleBtn.addEventListener('click', () => {
            if (!audioPlayer.src) {
                playSelectedSurah();
                return;
            }
            if (audioPlayer.paused) {
                audioPlayer.play();
                updatePlayIcon(true);
            } else {
                audioPlayer.pause();
                updatePlayIcon(false);
            }
        });

        function updatePlayIcon(isPlaying) {
            if (isPlaying) {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // أيقونة الإيقاف المؤقت
            } else {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // أيقونة التشغيل
            }
        }

        // تحديث شريط التقدم مع الوقت
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        });

        // التقديم والترجيع عبر شريط التقدم
        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
            }
        });

        // التحكم بالصوت
        volumeBar.addEventListener('input', () => {
            audioPlayer.volume = volumeBar.value;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
