<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل القرآن الكريم</title>
  <!-- FontAwesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* نص الآيات القرآنية المتحرك في الخلفية */
    .bg-quran-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      text-align: center;
      font-size: 2rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 1;
      line-height: 1.8;
      transition: opacity 1s ease-in-out;
      user-select: none;
    }

    /* تأثير تساقط الثلج */
    .snowflake {
      position: absolute;
      top: -10px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1em;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 2;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.1;
      }
    }

    /* كارت الواجهة الزجاجي المعتم */
    .player-card {
      width: 100%;
      max-width: 360px;
      background: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      padding: 28px 24px 20px 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    /* تفاصيل السورة والشيخ */
    .track-info {
      text-align: center;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .track-subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.55);
    }

    /* شريط التقدم المساعد للتحكم بالحركة */
    .progress-container {
      width: 100%;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 6px;
    }

    /* أزرار التحكم */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-bottom: 25px;
      width: 100%;
    }

    .control-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 0.1s ease, color 0.2s;
    }

    .control-btn:active {
      transform: scale(0.85);
    }

    .play-btn {
      font-size: 2.5rem;
      color: #fff;
    }

    /* شريط مستوى الصوت */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .volume-icon {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* زر البث السريع */
    .airplay-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      margin-bottom: 12px;
    }

    .airplay-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* قائمة اختيار القراء والآيات */
    .playlist-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 16px;
      outline: none;
      font-size: 0.85rem;
      margin-bottom: 18px;
    }

    /* زر انستغرام أسفل الواجهة كلياً */
    .instagram-btn {
      width: 100%;
      background: #e1306c;
      border: none;
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.35);
      transition: transform 0.2s, background-color 0.2s;
    }

    .instagram-btn:hover {
      background: #d6245f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- النص المكتوب الخاشع في الخلفية -->
  <div class="bg-quran-text" id="bg-text">
    أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ
  </div>

  <!-- تساقط الثلج -->
  <div id="snow-container"></div>

  <div class="player-card">
    <!-- تفاصيل السورة والشيخ -->
    <div class="track-info">
      <div class="track-title" id="title">متوقف</div>
      <div class="track-subtitle" id="subtitle">اختر تلاوة للبدء</div>
    </div>

    <!-- شريط التقدم للتحكم والتقديم والترجيع -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress"></div>
      </div>
      <div class="time-info">
        <span id="current-time">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
      <!-- زر ترجيع 10 ثوانٍ -->
      <button class="control-btn" id="prev" title="ترجيع 10 ثوانٍ"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="control-btn play-btn" id="play"><i class="fa-solid fa-play" id="play-icon"></i></button>
      <!-- زر تقديم 10 ثوانٍ -->
      <button class="control-btn" id="next" title="تقديم 10 ثوانٍ"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <!-- مستوى الصوت -->
    <div class="volume-container">
      <i class="fa-solid fa-volume-low volume-icon"></i>
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.8">
      <i class="fa-solid fa-volume-high volume-icon"></i>
    </div>

    <!-- زر البث السريع -->
    <button class="airplay-btn" id="airplay">
      <i class="fa-solid fa-tower-broadcast"></i>
      <span>البث السريع</span>
    </button>

    <!-- قائمة اختيار السور والقراء -->
    <select class="playlist-select" id="playlist">
      <option value="https://server11.mp3quran.net/yasser/001.mp3">سورة الفاتحة - ياسر الدوسري</option>
      <option value="https://server11.mp3quran.net/yasser/067.mp3">سورة الملك - ياسر الدوسري</option>
      <option value="https://server11.mp3quran.net/yasser/055.mp3">سورة الرحمن - ياسر الدوسري</option>
      <option value="https://server11.mp3quran.net/yasser/018.mp3">سورة الكهف - ياسر الدوسري</option>
      <option value="https://server16.mp3quran.net/moisa/055.mp3">سورة الرحمن - عبدالرحمن مسعد</option>
      <option value="https://server16.mp3quran.net/moisa/050.mp3">سورة ق - عبدالرحمن مسعد</option>
      <option value="https://backup.qurango.net/radio/yasser_al_dosari">إذاعة الشيخ ياسر الدوسري (بث)</option>
    </select>

    <!-- زر انستغرام في قاع الواجهة -->
    <a href="https://instagram.com/4x15" target="_blank" rel="noopener noreferrer" class="instagram-btn">
      <i class="fa-brands fa-instagram"></i>
      <span>انستكرام @4x15</span>
    </a>
  </div>

  <audio id="audio" src="https://server11.mp3quran.net/yasser/001.mp3"></audio>

  <script>
    // الآيات القرآنية التي تظهر وتتغير في الخلفية
    const quranVerses = [
      "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
      "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ",
      "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ",
      "اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ",
      "وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا"
    ];
    let verseIndex = 0;
    const bgText = document.getElementById('bg-text');

    setInterval(() => {
      bgText.style.opacity = '0';
      setTimeout(() => {
        verseIndex = (verseIndex + 1) % quranVerses.length;
        bgText.innerText = quranVerses[verseIndex];
        bgText.style.opacity = '1';
      }, 1000);
    }, 7000);

    // إنشاء تساقط الثلج
    const snowContainer = document.getElementById('snow-container');
    const flakeIcons = ['❄', '❅', '❆'];

    for (let i = 0; i < 35; i++) {
      const flake = document.createElement('div');
      flake.classList.add('snowflake');
      flake.innerText = flakeIcons[Math.floor(Math.random() * flakeIcons.length)];
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.animationDuration = Math.random() * 3 + 4 + 's';
      flake.style.animationDelay = Math.random() * 5 + 's';
      flake.style.fontSize = Math.random() * 10 + 12 + 'px';
      snowContainer.appendChild(flake);
    }

    // عناصر التحكم بالصوت
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const playlist = document.getElementById('playlist');
    const volume = document.getElementById('volume');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      isPlaying = true;
      playIcon.classList.remove('fa-play');
      playIcon.classList.add('fa-pause');
      audio.play().catch(error => console.log("خطأ في التشغيل:", error));
      title.innerText = "القرآن الكريم";
      subtitle.innerText = playlist.options[playlist.selectedIndex].text;
    }

    function pauseAudio() {
      isPlaying = false;
      playIcon.classList.remove('fa-pause');
      playIcon.classList.add('fa-play');
      audio.pause();
      title.innerText = "متوقف";
    }

    playBtn.addEventListener('click', togglePlay);

    // تقديم وترجيع 10 ثوانٍ
    nextBtn.addEventListener('click', () => {
      if (audio.duration) {
        audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (audio.duration) {
        audio.currentTime = Math.max(audio.currentTime - 10, 0);
      }
    });

    // اختيار سورة أو قارئ مختلف
    playlist.addEventListener('change', (e) => {
      audio.src = e.target.value;
      if (isPlaying) {
        playAudio();
      } else {
        subtitle.innerText = playlist.options[playlist.selectedIndex].text;
      }
    });

    // التحكم بالصوت
    volume.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    // تحديث وقت التشغيل وشريط التقدم
    audio.addEventListener('timeupdate', (e) => {
      const { duration, currentTime } = e.target;
      if (duration) {
        const progressPercent = (currentTime / duration) * 100;
        progress.style.width = `${progressPercent}%`;

        const formatTime = (time) => Math.floor(time / 60) + ':' + ('0' + Math.floor(time % 60)).slice(-2);
        currentTimeEl.innerText = formatTime(currentTime);
        durationEl.innerText = formatTime(duration);
      } else {
        currentTimeEl.innerText = "بث مباشر";
        durationEl.innerText = "LIVE";
      }
    });

    // إمكانية الضغط على شريط التقدم للتقديم والترجيع التفاعلي
    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    });
  </script>
</body>
</html>
