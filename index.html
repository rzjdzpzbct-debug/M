<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصائر | المصحف التفاعلي المتزامن</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #07090e;
            color: #f3f4f6;
        }
        .quran-text {
            font-family: 'Amiri', serif;
        }
        /* تنسيق الآية النشطة أثناء القراءة */
        .ayah-card {
            transition: all 0.3s ease;
            background: rgba(17, 24, 39, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ayah-card.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
            transform: scale(1.01);
        }
        .ios-player {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
        }
        select option {
            background-color: #1f2937;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#07090e] to-black">

    <!-- الهيدر -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800/80">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-extrabold text-2xl shadow-lg shadow-amber-500/10">ب</div>
            <div>
                <h1 class="text-xl font-black tracking-wide text-white">بصائر القرآنية</h1>
                <p class="text-[11px] text-gray-400">المصحف التفاعلي مع التزامن الصوتي</p>
            </div>
        </div>
        <span class="text-xs px-3.5 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">مصحف التزامن</span>
    </header>

    <!-- المحتوى الرئيسي: الآيات والمشغل -->
    <main class="max-w-4xl mx-auto w-full my-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- قسم عرض الآيات (يأخذ عمودين) -->
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-gray-900/60 border border-gray-800/80 rounded-[32px] p-6 shadow-xl backdrop-blur-xl flex justify-between items-center">
                <div>
                    <h2 id="currentSurahTitle" class="text-xl font-bold text-amber-400">سورة الفاتحة</h2>
                    <p id="currentReciterName" class="text-xs text-gray-400 mt-1">القارئ: مشاري العفاسي</p>
                </div>
                <button id="loadSurahBtn" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-4 py-2.5 rounded-xl font-bold transition">
                    تغيير السورة / القارئ
                </button>
            </div>

            <!-- صندوق الآيات المتزامنة -->
            <div id="ayasContainer" class="space-y-4 max-h-[550px] overflow-y-auto p-2 scrollbar-thin">
                <!-- تُعبأ الآيات برمجياً هنا -->
            </div>
        </div>

        <!-- لوحة التحكم ومشغل الأيفون (يأخذ عموداً واحداً) -->
        <div class="space-y-6">
            <div class="bg-gray-900/60 border border-gray-800/80 rounded-[32px] p-6 shadow-2xl backdrop-blur-xl">
                <h3 class="text-sm font-bold mb-4 text-amber-400 flex items-center gap-2">
                    <span>⚙️</span> إعدادات التشغيل
                </h3>
                
                <div class="mb-4">
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1.5">اختر القارئ</label>
                    <select id="reciterSelect" class="w-full bg-gray-800/90 border border-gray-700/80 rounded-xl p-3 text-white text-xs focus:outline-none focus:border-amber-500 transition cursor-pointer">
                        <!-- تُعبأ برمجياً -->
                    </select>
                </div>

                <div class="mb-5">
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1.5">اختر السورة</label>
                    <select id="surahSelect" class="w-full bg-gray-800/90 border border-gray-700/80 rounded-xl p-3 text-white text-xs focus:outline-none focus:border-amber-500 transition cursor-pointer">
                        <!-- تُعبأ برمجياً -->
                    </select>
                </div>

                <button id="playBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-950 font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 text-xs active:scale-[0.98]">
                    بدء الاستماع والتزامن
                </button>
            </div>

            <!-- مشغل الأيفون المصغر -->
            <div class="ios-player rounded-[32px] p-5 w-full flex flex-col justify-between">
                <div class="text-center mb-4">
                    <h4 id="trackTitle" class="text-sm font-bold text-white truncate">اختر سورة للبدء</h4>
                </div>

                <div class="mb-4">
                    <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full h-1 bg-gray-700/80 rounded-lg appearance-none cursor-pointer accent-amber-400">
                    <div class="flex justify-between text-[10px] text-gray-400 mt-1 font-mono">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="flex items-center justify-center gap-4 mb-4">
                    <button id="prevBtn" class="text-gray-400 hover:text-white transition p-1">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button id="mainToggleBtn" class="w-12 h-12 rounded-full bg-white text-gray-950 flex items-center justify-center shadow-lg hover:scale-105 transition">
                        <svg id="playIcon" class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button id="nextBtn" class="text-gray-400 hover:text-white transition p-1">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-black/30 p-2.5 rounded-xl border border-white/5">
                    <svg class="w-3.5 h-3.5 text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white">
                </div>
            </div>
        </div>

    </main>

    <audio id="audioPlayer"></audio>

    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-500 py-6 border-t border-gray-800/80">
        تم الإنشاء بكل حب لنشر القرآن الكريم &copy; 2026
    </footer>

    <script>
        const recitersData = [
            { name: "مشاري العفاسي", server: "https://server8.mp3quran.net/afs/" },
            { name: "عبد الرحمن السديس", server: "https://server11.mp3quran.net/sds/" },
            { name: "ماهر المعيقلي", server: "https://server12.mp3quran.net/maher/" }
        ];

        // عينة تفصيلية لآيات السور (مع نصوص حقيقية لتفعيل نظام التحديد المتزامن)
        const surahsData = [
            { 
                id: 1, name: "الفاتحة", 
                ayas: [
                    "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                    "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
                    "الرَّحْمَٰنِ الرَّحِيمِ",
                    "مَالِكِ يَوْمِ الدِّينِ",
                    "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
                    "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
                    "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
                ]
            },
            { 
                id: 2, name: "الإخلاص", 
                ayas: [
                    "قُلْ هُوَ اللَّهُ أَحَدٌ",
                    "اللَّهُ الصَّمَدُ",
                    "لَمْ يَلِدْ وَلَمْ يُولَدْ",
                    "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"
                ]
            },
            {
                id: 3, name: "الكوثر",
                ayas: [
                    "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ",
                    "فَصَلِّ لِرَبِّكَ وَانْحَرْ",
                    "إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"
                ]
            }
        ];

        const reciterSelect = document.getElementById('reciterSelect');
        const surahSelect = document.getElementById('surahSelect');
        const ayasContainer = document.getElementById('ayasContainer');
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const currentSurahTitle = document.getElementById('currentSurahTitle');
        const currentReciterName = document.getElementById('currentReciterName');
        const mainToggleBtn = document.getElementById('mainToggleBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const volumeBar = document.getElementById('volumeBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // تعبئة القوائم
        recitersData.forEach((reciter, i) => reciterSelect.add(new Option(reciter.name, i)));
        surahsData.forEach((surah, i) => surahSelect.add(new Option(`سورة ${surah.name}`, i)));

        // عرض آيات السورة المحددة
        function renderAyas(surahIndex) {
            const surah = surahsData[surahIndex];
            currentSurahTitle.textContent = `سورة ${surah.name}`;
            ayasContainer.innerHTML = '';
            
            surah.ayas.forEach((text, index) => {
                const div = document.createElement('div');
                div.className
