<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة بصيرة القرآنية — قراءة، تدبر، واستماع إلى القرآن الكريم" />
    <title>بصيرة | Basira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="status-bar">
        <div class="status-left">
          <span class="signal">◔</span>
          <span class="wifi">◌</span>
          <span class="battery">◍</span>
        </div>
        <div class="status-time">3:04</div>
      </header>

      <div class="browser-bar">
        <div class="browser-controls">
          <button class="icon-btn" aria-label="back">⌂</button>
          <button class="icon-btn" aria-label="new tab">＋</button>
          <button class="icon-btn" aria-label="menu">ᵒ</button>
        </div>

        <div class="browser-address">
          <span class="address-lock">◌</span>
          <span>basira.institute</span>
          <span class="address-actions">↩</span>
        </div>

        <div class="browser-actions">
          <button class="icon-btn small" aria-label="next">›</button>
          <button class="icon-btn small" aria-label="window">□</button>
        </div>
      </div>

      <nav class="main-tabs" aria-label="Navigation">
        <div class="tab-group">
          <button class="tab-pill active">بصيرة</button>
          <button class="tab-pill muted">ساحة</button>
          <button class="tab-pill muted">مكتبة</button>
          <button class="tab-pill muted">مؤلفات</button>
          <button class="tab-pill muted">رِعْيَة</button>
        </div>
        <div class="tab-usercapsule">G</div>
      </nav>

      <main class="layout">
        <aside class="sidebar-panel">
          <button class="sidebar-toggle" aria-label="toggle sidebar">☰</button>
          <div class="brand-word">BASIRA</div>
        </aside>

        <section class="content-panel">
          <div class="content-toolbar">
            <div class="toolbar-left">
              <button class="pill small" id="selectedSurahBadge">Al-Mu'minûn</button>
            </div>
            <div class="toolbar-right">
              <button class="pill small">Learn</button>
              <button class="pill small">Focus</button>
              <button class="pill small">Light</button>
              <button class="pill small">Tajweed</button>
              <button class="pill small">English — Sahih International</button>
            </div>
          </div>

          <div class="study-header">
            <div class="study-title" id="studyTitle">Success Blueprint &amp; Biology</div>
            <div class="study-verse" id="studyVerse">1–50</div>
            <div class="study-meter" id="studyMeter">1/2</div>
          </div>

          <div class="filter-hud">
            <input id="surahSearch" type="text" placeholder="ابحث عن سورة..." aria-label="ابحث عن سورة" />
          </div>

          <div class="surah-layout">
            <div class="surah-sidebar" id="surahList" aria-live="polite"></div>

            <div class="verse-content">
              <div class="card-verse active" id="verseCard">
                <div class="verse-meta">
                  <span class="meta-tag" id="ayahNumberTag">23:14</span>
                  <span class="meta-tag soft">TAFSIR</span>
                  <span class="meta-tag soft purple">TADABBUR</span>
                  <button class="mini-btn" aria-label="more">⋯</button>
                </div>

                <div class="arabic-verse big" id="ayahText" lang="ar"></div>

                <div class="english-translation" id="ayahTranslation"></div>
              </div>

              <div class="ayah-selector-wrap">
                <label for="ayahSelect"></label>
                <select id="ayahSelect" aria-label="اختيار آية"></select>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <div class="bottom-player">
      <div class="play-left">
        <button class="round-btn" id="playToggle" aria-label="تشغيل">▶</button>
        <div class="player-title" id="playerTitle">البقرة</div>
      </div>

      <div class="player-center">
        <button class="mini-player" id="prevBtn" aria-label="السابق">⏮</button>
        <button class="mini-player active" id="playBtn" aria-label="تشغيل/إيقاف">▶</button>
        <button class="mini-player" id="nextBtn" aria-label="التالي">⏭</button>
      </div>

      <div class="play-right">
        <span id="playerTime">00:00</span>
        <select id="reciterSelect" aria-label="اختيار القارئ">
          <option value="Abdul_Basit_Murattal_64kbps">عبد الباسط</option>
          <option value="Mishary_Alafasy_128kbps">مشاري العفاسي</option>
        </select>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
