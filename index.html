<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة قرآنية حديثة لتلاوة، تدبر، وترجمة القرآن" />
    <title>بصيرة | Basira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="browser-topbar">
        <div class="window-actions">
          <span class="window-dot close"></span>
          <span class="window-dot min"></span>
          <span class="window-dot max"></span>
        </div>

        <div class="browser-tabs">
          <div class="browser-tab active">basira.institute</div>
        </div>

        <div class="browser-tools">
          <button class="tool-icon">⤴</button>
          <button class="tool-icon">⋯</button>
          <button class="tool-icon">⚙</button>
        </div>
      </div>

      <div class="toolbar-row">
        <div class="toolbar-left">
          <button class="nav-pill">🡠</button>
          <button class="nav-pill">🡢</button>
          <button class="nav-pill">⟳</button>
        </div>
        <div class="toolbar-center">
          <div class="site-pill">basira.institute</div>
        </div>
        <div class="toolbar-right">
          <button class="nav-pill">＋</button>
          <button class="nav-pill">☰</button>
        </div>
      </div>

      <div class="sub-nav">
        <div class="sub-nav-left">
          <button class="sub-tab">بصيرة</button>
          <button class="sub-tab">مكتبة</button>
          <button class="sub-tab">تاريخ</button>
          <button class="sub-tab">مؤلفات</button>
        </div>
        <div class="sub-nav-right">
          <button class="mini-toggle active">Learn</button>
          <button class="mini-toggle">Focus</button>
          <button class="mini-toggle">Tajweed</button>
        </div>
      </div>

      <main class="workspace">
        <aside class="left-panel">
          <div class="panel-header">
            <span class="brand">BASIRA</span>
          </div>
          <div class="side-search">
            <input type="text" id="sidebarSearch" placeholder="ابحث عن سورة..." />
          </div>
          <div class="surah-list" id="surahList"></div>
        </aside>

        <section class="content-panel">
          <div class="content-header">
            <div class="top-actions">
              <button class="mode-btn active" data-mode="read">قراءة</button>
              <button class="mode-btn" data-mode="tajweed">تجويد</button>
              <button class="mode-btn" data-mode="translation">ترجمة</button>
            </div>
            <div class="top-status">
              <span id="surahCounter">1 / 114</span>
            </div>
          </div>

          <div class="study-meta">
            <div class="study-name" id="studyName">الفاتحة</div>
            <div class="study-attrs">مكية • 7 آيات</div>
          </div>

          <div class="verse-wrap">
            <div class="verse-card" id="verseCard">
              <div class="meta-row">
                <span class="meta-chip" id="ayahBadge">آية 1</span>
                <span class="meta-chip soft">TAFSIR</span>
                <span class="meta-chip soft purple">TADABBUR</span>
              </div>

              <div class="verse-arabic" id="verseArabic"></div>
              <div class="verse-english" id="verseEnglish"></div>
            </div>

            <div class="nav-row">
              <button id="prevAyahBtn" class="nav-action">السابق</button>
              <select id="ayahSelect" class="ayah-select"></select>
              <button id="nextAyahBtn" class="nav-action">التالي</button>
            </div>
          </div>
        </section>
      </main>

      <footer class="audio-bar">
        <div class="player-info">
          <div class="player-title" id="playerTitle">الفاتحة</div>
          <div class="player-time" id="playerTime">00:00 / 00:00</div>
        </div>

        <div class="audio-controls">
          <button class="audio-btn" id="prevSurahBtn">⏮</button>
          <button class="audio-btn primary" id="playBtn">▶</button>
          <button class="audio-btn" id="nextSurahBtn">⏭</button>
        </div>

        <div class="player-selectors">
          <select id="reciterSelect">
            <option value="Abdul_Basit_Murattal_64kbps">عبد الباسط</option>
            <option value="Mishary_Alafasy_128kbps">مشاري العفاسي</option>
            <option value="AbdulSamad_64kbps_Rawat">عبد الصمد</option>
          </select>
          <input type="range" id="volumeSlider" min="0" max="100" value="70" />
        </div>
      </footer>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>
    <script src="script.js"></script>
  </body>
</html>
