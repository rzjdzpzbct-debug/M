<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="منصة قرآنية حديثة - اقرأ، استمع، وتدبر القرآن الكريم">
    <title>Quranic Studio | قراءة وتدبر القرآن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- الشريط العلوي -->
        <header class="app-header">
            <div class="header-left">
                <button class="btn-menu" aria-label="menu">☰</button>
                <div class="logo">📖 Quranic Studio</div>
            </div>
            <div class="header-center">
                <input type="text" id="searchInput" placeholder="ابحث عن سورة..." class="search-box" aria-label="بحث">
            </div>
            <div class="header-right">
                <button class="btn-icon" aria-label="settings">⚙️</button>
                <button class="btn-icon" aria-label="profile">👤</button>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <div class="main-container">
            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>السور</h2>
                    <span class="badge" id="totalSurahs">114</span>
                </div>
                <div class="sidebar-filter">
                    <input type="text" id="sidebarSearch" placeholder="بحث..." class="filter-input">
                </div>
                <div class="surah-list" id="surahList"></div>
            </aside>

            <!-- منطقة القراءة الرئيسية -->
            <main class="reader-area">
                <!-- شريط الأدوات -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <button class="tool-btn active" data-mode="read">📖 قراءة</button>
                        <button class="tool-btn" data-mode="tajweed">🎨 تجويد</button>
                        <button class="tool-btn" data-mode="translation">🌍 ترجمة</button>
                    </div>
                    <div class="toolbar-right">
                        <select id="translationSelect" class="select-field">
                            <option value="en.asad">الترجمة الإنجليزية</option>
                            <option value="ar.muyassar">التفسير المختصر</option>
                        </select>
                    </div>
                </div>

                <!-- معلومات السورة -->
                <div class="surah-info" id="surahInfo">
                    <h1 id="surahNameAr" class="surah-name-ar">الفاتحة</h1>
                    <p id="surahDetails" class="surah-details">السورة الأولى | 7 آيات | مكية</p>
                </div>

                <!-- منطقة الآيات -->
                <div class="verses-container" id="versesContainer"></div>

                <!-- التنقل بين الآيات -->
                <div class="verses-nav">
                    <button class="nav-btn" id="prevVerseBtn">← السابقة</button>
                    <select id="ayahJump" class="select-field"></select>
                    <button class="nav-btn" id="nextVerseBtn">التالية →</button>
                </div>
            </main>
        </div>

        <!-- مشغل الصوت السفلي -->
        <footer class="player-footer">
            <audio id="audioPlayer" preload="auto"></audio>
            
            <div class="player-container">
                <div class="player-info">
                    <div class="player-title" id="playerTitle">الفاتحة</div>
                    <div class="player-time" id="playerTime">00:00 / 00:00</div>
                </div>

                <div class="player-controls">
                    <button class="control-btn" id="prevSurahBtn" aria-label="السورة السابقة">⏮</button>
                    <button class="control-btn play-btn" id="playBtn" aria-label="تشغيل">▶</button>
                    <button class="control-btn" id="nextSurahBtn" aria-label="السورة التالية">⏭</button>
                </div>

                <div class="player-extras">
                    <select id="reciterSelect" class="select-field">
                        <option value="abdul-basit">عبد الباسط - مرتل</option>
                        <option value="mishary">مشاري العفاسي</option>
                        <option value="sudais">السديس</option>
                    </select>
                    <input type="range" id="volumeSlider" min="0" max="100" value="70" class="volume-slider" aria-label="مستوى الصوت">
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
