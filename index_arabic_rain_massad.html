<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>مصحفي — القرآن الكريم</title>
  <meta name="description" content="مصحف إلكتروني بسيط لقراءة القرآن الكريم والاستماع إلى التلاوة.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f7f5ef;--card:#fff;--text:#182230;--muted:#687386;--accent:#0f766e;--accent2:#115e59;--line:#e7e4dc;--shadow:0 12px 40px #17203312}
    body.dark{--bg:#0b1220;--card:#111b2d;--text:#f2f5f7;--muted:#aab5c6;--accent:#2dd4bf;--accent2:#14b8a6;--line:#26344a;--shadow:0 12px 40px #0005}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#e9f4f0 0,var(--bg) 38%);color:var(--text);font-family:Cairo,system-ui,sans-serif;transition:.25s}
    body.dark{background:radial-gradient(circle at top,#12263a 0,var(--bg) 40%)}
    header{position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);background:#ffffffcc;border-bottom:1px solid var(--line)}
    body.dark header{background:#0b1220cc}.bar{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
    .brand{font-weight:800;font-size:20px;margin-left:auto}.brand span{color:var(--accent)}
    button,input{font:inherit}.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}
    main{max-width:1100px;margin:auto;padding:28px 18px 100px}.hero{padding:34px 26px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#0f766e,#134e4a);color:white;box-shadow:var(--shadow);overflow:hidden;position:relative}
    .hero:after{content:"ﷲ";font-family:Amiri;font-size:190px;position:absolute;left:30px;top:-40px;opacity:.08}.hero h1{font-family:Amiri;font-size:42px;margin:0 0 8px}.hero p{margin:0;opacity:.9}
    .tools{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);outline:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.surah{display:flex;align-items:center;gap:13px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;box-shadow:var(--shadow);text-align:right}
    .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e7f3f0;color:var(--accent);font-weight:800}.surah .name{font-family:Amiri;font-size:23px;font-weight:700}.surah small{display:block;color:var(--muted);font-family:Cairo;font-size:12px}
    .reader{display:none}.reader.active{display:block}.back{margin-bottom:15px}.title{text-align:center;font-family:Amiri;font-size:38px;margin:10px 0 4px}.meta{text-align:center;color:var(--muted);margin-bottom:22px}
    .ayah{padding:22px 10px;border-bottom:1px solid var(--line);font-family:Amiri;font-size:29px;line-height:2.15}.ayahnum{color:var(--accent);font-family:Cairo;font-size:13px;margin-right:8px}
    .ayah button{float:left;font-size:13px}.audio{width:100%;margin:18px 0}.notice{color:var(--muted);text-align:center;padding:25px}
    #arabicRain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;opacity:.22}
    .rain-char{position:absolute;top:-70px;color:var(--accent);font-family:Amiri,serif;font-size:clamp(20px,3vw,38px);animation:fall linear infinite;user-select:none;text-shadow:0 0 12px #0f766e55}
    @keyframes fall{0%{transform:translateY(-80px) rotate(0deg);opacity:0}10%{opacity:.75}90%{opacity:.35}100%{transform:translateY(110vh) rotate(180deg);opacity:0}}
    body.dark #arabicRain{opacity:.30}
    .reciter-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
    .reciter-label{font-weight:700;color:var(--text)}
    .reciter-select{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);min-width:240px}
    @media(max-width:600px){.hero h1{font-size:34px}.ayah{font-size:25px}.grid{grid-template-columns:1fr 1fr}.surah{padding:12px}.surah .name{font-size:20px}}
  </style>
</head>
<body>
<div id="arabicRain" aria-hidden="true"></div>
<header><div class="bar"><div class="brand">مصحفي <span>• القرآن الكريم</span></div><button class="icon" id="theme">☾</button></div></header>
<main>
<section id="home">
  <div class="hero"><h1>القرآن الكريم</h1><p>اقرأ كلام الله واستمع إلى التلاوة بسهولة وهدوء.</p></div>
  <div class="tools"><input id="search" class="search" placeholder="ابحث باسم السورة أو رقمها..."><button class="icon" id="random">آية عشوائية</button></div>
  <div class="reciter-box">
    <span class="reciter-label">القارئ:</span>
    <select id="reciter" class="reciter-select">
      <option value="ar.alafasy">مشاري راشد العفاسي</option>
      <option value="massad">عبد الرحمن مسعد</option>
    </select>
  </div>
  <div id="surahs" class="grid"><div class="notice">جاري تحميل السور...</div></div>
</section>
<section id="reader" class="reader">
  <button class="icon back" id="back">← العودة للسور</button>
  <h2 id="surahTitle" class="title"></h2><div id="surahMeta" class="meta"></div>
  <audio id="player" class="audio" controls></audio>
  <div id="ayahs"></div>
</section>
</main>
<script>
const API="https://api.alquran.cloud/v1";
let selectedReciter="ar.alafasy";
const $=s=>document.querySelector(s);
let allSurahs=[];
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw Error("Network");return r.json();}
async function loadSurahs(){
  try{const j=await getJSON(API+"/surah");allSurahs=j.data;renderSurahs(allSurahs)}
  catch(e){$("#surahs").innerHTML='<div class="notice">تعذر تحميل السور. تأكد من اتصال الإنترنت ثم أعد المحاولة.</div>'}
}
function renderSurahs(list){$("#surahs").innerHTML=list.map(s=>`
<button class="surah" data-id="${s.number}">
  <div class="num">${s.number}</div><div><div class="name">${s.name}</div><small>${s.englishName} • ${s.numberOfAyahs} آية • ${s.revelationType==="Meccan"?"مكية":"مدنية"}</small></div>
</button>`).join("")||'<div class="notice">لا توجد نتائج.</div>';
document.querySelectorAll(".surah").forEach(b=>b.onclick=()=>openSurah(+b.dataset.id))}
async function openSurah(id){
  window.currentSurahId=id;
  $("#home").style.display="none";$("#reader").classList.add("active");window.scrollTo(0,0);
  $("#ayahs").innerHTML='<div class="notice">جاري تحميل السورة...</div>';
  try{
    const [text,audio]=await Promise.all([getJSON(`${API}/surah/${id}/quran-uthmani`),getJSON(`${API}/surah/${id}/ar.alafasy`)]);
    const s=text.data;$("#surahTitle").textContent=s.name;$("#surahMeta").textContent=`${s.englishName} • ${s.numberOfAyahs} آية • ${s.revelationType==="Meccan"?"مكية":"مدنية"}`;
    if(selectedReciter==="ar.alafasy"){
      $("#player").src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${id}.mp3`;
    }else{
      $("#player").removeAttribute("src");
      $("#player").load();
      $("#ayahs").insertAdjacentHTML("afterbegin",
        '<div class="notice">القارئ عبد الرحمن مسعد مضاف للقائمة، لكن مصدر صوته غير متاح حالياً عبر API العام المستخدم للموقع.</div>');
    }
    $("#ayahs").innerHTML=s.ayahs.map(a=>`<div class="ayah">${a.text} <span class="ayahnum">﴿${a.numberInSurah}﴾</span><button class="icon play" data-n="${a.number}">▶</button></div>`).join("");
    document.querySelectorAll(".play").forEach(b=>b.onclick=()=>{
      if(selectedReciter!=="ar.alafasy"){
        alert("مصدر صوت عبد الرحمن مسعد غير متاح حالياً عبر API العام.");
        return;
      }
      $("#player").src=`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${b.dataset.n}.mp3`;
      $("#player").play();
    });
  }catch(e){$("#ayahs").innerHTML='<div class="notice">حدث خطأ أثناء تحميل السورة.</div>'}
}
$("#back").onclick=()=>{$("#reader").classList.remove("active");$("#home").style.display="block";window.scrollTo(0,0)}
$("#search").oninput=e=>{const q=e.target.value.trim().toLowerCase();renderSurahs(allSurahs.filter(s=>String(s.number)===q||s.name.includes(q)||s.englishName.toLowerCase().includes(q)))}
$("#random").onclick=async()=>{try{const j=await getJSON(API+"/ayah/random/quran-uthmani");const a=j.data;alert(`${a.surah.name}\n\n${a.text}\n\nالآية ${a.numberInSurah}`)}catch(e){alert("تعذر جلب الآية الآن.")}}
$("#theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.theme=document.body.classList.contains("dark")?"dark":"light";$("#theme").textContent=document.body.classList.contains("dark")?"☀":"☾"}
if(localStorage.theme==="dark"){$("#theme").click()}

$("#reciter").onchange=e=>{
  selectedReciter=e.target.value;
  if(window.currentSurahId) openSurah(window.currentSurahId);
};

function makeArabicRain(){
  const box=$("#arabicRain"), chars="ابتثجحخدذرزسشصضطظعغفقكلمنهوي";
  for(let i=0;i<34;i++){
    const s=document.createElement("span");
    s.className="rain-char";
    s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=(Math.random()*100)+"%";
    s.style.animationDuration=(8+Math.random()*12)+"s";
    s.style.animationDelay=(-Math.random()*18)+"s";
    box.appendChild(s);
  }
}
makeArabicRain();
loadSurahs();
</script>
</body>
</html>
