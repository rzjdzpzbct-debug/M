<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صَبْر — بوابة القرآن</title><style>:root{--bg:#07100e;--p:#0d1916;--l:#28453b;--g:#d7b56d;--t:#eee9dc;--m:#9ea99f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17342b,#07100e 48%,#050908);color:var(--t);font-family:Georgia,"Noto Naskh Arabic",serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 50px}header{text-align:center;padding:25px 0 18px}.mark{font-size:16px;letter-spacing:8px;color:var(--g);margin-bottom:12px}.brand{font-size:54px;letter-spacing:12px}.sub{color:var(--m);margin-top:10px;font:13px Arial}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.card{position:relative;border:1px solid var(--l);background:linear-gradient(145deg,#10201b,#0a1412);border-radius:16px;padding:22px;min-height:145px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#6f8f7e}.num{position:absolute;left:14px;top:12px;color:#50665b;font:12px Arial}.ar{font-size:25px;color:var(--g);margin-bottom:8px}.en{font:700 14px Arial}.desc{font:12px Arial;color:var(--m);margin-top:7px;line-height:1.5}.screen{display:none;margin-top:22px;border:1px solid var(--l);border-radius:18px;background:#091310;padding:22px}.screen.active{display:block}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #1d332c;padding-bottom:15px;margin-bottom:18px}button,select{background:#0e1c18;color:var(--t);border:1px solid #35564a;border-radius:10px;padding:10px 13px;font:14px Arial}button{cursor:pointer}h2{margin:0;color:var(--g)}.muted{color:var(--m);font-family:Arial}.quran{font-size:25px;line-height:2.2}.ayah{padding:12px 0;border-bottom:1px solid #183028}.ayah small{color:#71857b;font:11px Arial}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:16px;border:1px solid #244137;border-radius:12px;background:#0c1814}.tile b{color:var(--g);display:block;margin-bottom:5px}.names{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.name{padding:14px;border:1px solid #264238;border-radius:12px;text-align:center}.name strong{display:block;font-size:23px;color:var(--g)}.footer{text-align:center;color:#65756d;font:11px Arial;margin-top:28px;line-height:2}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:39px}.names{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><div class="mark">صَبْر</div><div class="brand">S A B R</div><div class="sub">Choose Your Path of Illumination</div></header><main class="grid" id="gateway"></main><section class="screen" id="screen"></section><div class="footer">23+ Languages · ʿIlm al-Munāsabāt<br>v0.1.0 — Sabr Gateway</div></div><script>
const modules=[["بصيرة","The Quranic Engine","Structural Revelation · 114 Surahs","quran"],["الأسماء الحسنى","The Divine Attributes","99 Names of Allah","names"],["المكتبة","The Scholar's Archive","Free Islamic Library","library"],["علم الرجال","The Isnad Blockchain","Cryptographic Verification","isnad"],["السيرة النبوية","The Seerah Engine","The Prophetic Journey","seerah"],["محور القبلة","The Qibla Axis","3D Directional Compass","qibla"],["الترتيل","Tartil Engine","Real-Time Recitation Training","tartil"],["التدرّج","The Sharia State Machine","Rulings Evaluated Across 23 Years","sharia"],["إعجاز القرآن","The Inimitable Qur'an","The Challenge · Never Answered","ijaz"]];const gateway=document.getElementById('gateway'),screen=document.getElementById('screen');modules.forEach((m,i)=>gateway.innerHTML+=`<article class="card" onclick="openModule('${m[3]}')"><span class="num">${i+1}</span><div class="ar">${m[0]}</div><div class="en">${m[1]}</div><div class="desc">${m[2]}</div></article>`);const names=["الرَّحْمَنُ","الرَّحِيمُ","الْمَلِكُ","الْقُدُّوسُ","السَّلَامُ","الْمُؤْمِنُ","الْمُهَيْمِنُ","الْعَزِيزُ","الْجَبَّارُ","الْمُتَكَبِّرُ","الْخَالِقُ","الْبَارِئُ","الْمُصَوِّرُ","الْغَفَّارُ","الْقَهَّارُ","الْوَهَّابُ","الرَّزَّاقُ","الْفَتَّاحُ","الْعَلِيمُ","الْحَكِيمُ","الْوَدُودُ","الْحَفِيظُ","الْكَرِيمُ","الْحَقُّ"];const surahs=[["الفاتحة",7],["البقرة",286],["آل عمران",200],["النساء",176],["المائدة",120],["الأنعام",165],["الأعراف",206],["الأنفال",75],["التوبة",129],["يونس",109],["هود",123],["يوسف",111],["الرعد",43],["إبراهيم",52],["الحجر",99],["النحل",128],["الإسراء",111],["الكهف",110],["مريم",98],["طه",135]];function base(t,c){screen.innerHTML=`<div class="topbar"><h2>${t}</h2><button onclick="closeModule()">← البوابة الرئيسية</button></div>${c}`;screen.classList.add('active');screen.scrollIntoView({behavior:'smooth'})}function closeModule(){screen.classList.remove('active');scrollTo({top:0,behavior:'smooth'})}function openModule(type){if(type==='quran')return quran();if(type==='names')return base('الأسماء الحسنى',`<p class="muted">The Divine Attributes · 99 Names of Allah</p><div class="names">${names.map((n,i)=>`<div class="name"><small>${i+1}</small><strong>${n}</strong><span class="muted">اسم من أسماء الله الحسنى</span></div>`).join('')}</div>`);const d={library:['المكتبة','واجهة أرشيف علمي قابلة للتوسعة للكتب والمراجع والدروس.'],isnad:['علم الرجال','سجل رواة وسلاسل إسناد مع واجهة تحقق ومخطط للعلاقات.'],seerah:['السيرة النبوية','محور زمني للرحلة النبوية والأحداث الرئيسية.'],qibla:['محور القبلة','بوصلة اتجاهية؛ اسمح للموقع باستخدام مستشعر الهاتف عند توفره.'],tartil:['الترتيل','واجهة تدريب على التلاوة: آية، تشغيل، متابعة، وتقييم لاحقًا.'],sharia:['التدرّج','خط زمني للأحكام عبر مراحل الوحي مع بطاقات تحليلية.'],ijaz:['إعجاز القرآن','واجهة موضوعية للتدبر في البنية والنظم والتحدي القرآني.']};if(d[type]){const[t,x]=d[type];base(t,`<p class="muted">${x}</p><div class="tiles">${['المحور الرئيسي','الخط الزمني','المراجع','الملاحظات'].map(x=>`<div class="tile"><b>${x}</b>واجهة جاهزة للإضافة والتوسعة داخل نفس الملف.</div>`).join('')}</div>`)}}function quran(){base('بصيرة — محرك القرآن',`<p class="muted">Structural Timeline · 114 Surahs</p><div class="topbar"><select id="s">${surahs.map((x,i)=>`<option value="${i+1}">${i+1} — ${x[0]} · ${x[1]} آية</option>`).join('')}</select><button onclick="loadSurah()">فتح السورة</button></div><div id="q"><div class="tile"><b>Structural Context</b>اختر سورة لعرض الآيات.</div></div>`)}async function loadSurah(){const id=document.getElementById('s').value,q=document.getElementById('q');q.innerHTML='<p class="muted">جارٍ تحميل الآيات…</p>';try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`),j=await r.json();q.innerHTML=`<div class="quran">${j.data.ayahs.map(a=>`<div class="ayah">${a.text} <small>﴿${a.numberInSurah}﴾</small></div>`).join('')}</div>`}catch(e){q.innerHTML='<div class="tile"><b>تعذر التحميل</b>تأكد من اتصال الإنترنت ثم أعد المحاولة.</div>'}}</script></body></html>
